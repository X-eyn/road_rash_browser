<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Road Rash '96 — Browser Port</title>
<meta name="description" content="A fan preservation port of Road Rash (1996, PC) running in the browser. Race, fight and wreck on the original five courses.">
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<link rel="stylesheet" href="./ui.css">
</head>
<body>
  <div id="boot">
    <div id="boot-bg"></div>
    <div id="boot-shade"></div>
    <div id="boot-ui">
      <div id="boot-title">ROAD RASH</div>
      <div id="boot-sub">1996 · PC preservation port</div>
      <div id="boot-bar"><i></i></div>
      <div id="boot-prompt">LOADING…</div>
      <div id="boot-note">Use your own copy of Road Rash (1996). Fan port — not affiliated with EA.</div>
    </div>
  </div>

  <div id="app" aria-hidden="true">
    <div id="stage">
      <div id="bg"></div>
      <div id="shade"></div>
      <div id="ui"></div>
      <div id="race" hidden>
        <canvas id="race-canvas" width="640" height="480"></canvas>
        <div id="hud"></div>
      </div>
      <div id="fade"></div>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
